<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ajuda - FastRail</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100dvh;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Arial, sans-serif;
    }

    .logo{
    margin-left: -70px;
  }

  .tela{
    width:400px;
    height:440px;
    background:#f5f5f5;
    border-radius:25px;
    box-shadow:0 2px 5px rgba(0,0,0,0.3);
    padding:20px;
    position:relative;
}

.btn_voltar{
    position:absolute;
    top:15px;
    left:10px;
    font-size:24px;
    color:#3b0000;
}

.contato{
    text-align:center;
    margin-top:70px;
    color:#5a0000;
    font-weight:bold;
}

.box{
    background:#8b0000;
    color:white;
    border-radius:5px;
    padding:15px;
    text-align:center;
    margin-top:15px;
}

.box p{
    margin:12px 0;
    font-weight:bold;
}

.titulo{
    font-size:16px;
    font-weight:bold;
    color:#3b0000;
    margin-left:25px;
}
  </style>
</head>
<body>

 <div class="tela">

    <div class="voltar">‹</div>
    <div class="titulo">Ajuda</div>

    <div class="logo">
        <h1>FastRail</h1>
    </div>

    <div class="contato">
        Entre em contato<br>
        conosco por:
    </div>

    <div class="box">
        <p>Email:</p>
        <p>fastrail@gmail.com</p>

        <p>Telefone:</p>
        <p>(99) 1234-5678</p>
    </div>

</div>

</body>
</html>
