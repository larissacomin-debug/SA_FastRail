<!doctype html>
<html lang="pt-br">

    <meta charset="UTF-8" />

    <title>Ingressos</title>

    <link rel="stylesheet" href="ingressos.css" />

    <div class="principal">

        <div class="logo">

        <h2>Ingressos</h2>

          </div>

          <div class="grupo">
            <p>Informe seu destino:</p>

            <input type="text" id="destino" placeholder=" " />

            <label for="destino">Insira seu destino</label>
          </div>

          <button
            type="button"
            class="botao-login"
            onclick="window.location.href = 'tela-login.html'"
          >
            Conferir
          </button>
        </form>
