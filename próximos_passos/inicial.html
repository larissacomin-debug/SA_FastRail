<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FastRail</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100dvh;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Arial, sans-serif;
    }

    .logo{
    margin-left: -70px;
  }

    .btn-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      width: 260px;
    }

    .btn {
      width: 100%;
      padding: 13px 24px;
      border: 2px solid #8B1A1A;
      border-radius: 6px;
      background: transparent;
      color: #8B1A1A;
      font-size: 0.95rem;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: background 140ms ease, color 140ms ease;
    }

    .btn:hover  { background: #8B1A1A; color: #fff; }
    .btn:active { transform: scale(0.97); }
    :focus-visible { outline: 2px solid #8B1A1A; outline-offset: 2px; }
  </style>
</head>
<body>

  <div class="logo">
        <img
          src="/assets/Logo.png"
          alt="Minha logo"
          width="400px"
          margin-right="10px"
        />
      </div>

  <div class="btn-group">
    <button class="btn" onclick="window.location.href = 'tela-login.html'">Comprar Ingressos</button>
    <button class="btn">Acessar seu Perfil</button>
    <button class="btn">Ajuda</button>
  </div>

</body>
</html>
